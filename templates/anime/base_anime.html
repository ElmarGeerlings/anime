{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Anime Tier List{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'anime/anime.css' %}">
</head>
<body>
    <div class="anime-page" id="anime-page">
        <script>
        (function () {
            var page = document.getElementById('anime-page');
            var stored = localStorage.getItem('anime_tier_mode');
            var useText = stored === 'text' || (stored !== 'posters' && window.matchMedia('(max-width: 600px)').matches);
            if (useText) {
                page.classList.add('anime-page--text');
            }
        })();
        </script>
        <header class="anime-header">
            <h1 class="anime-site-title"><a href="{% url 'tier_list' %}">Anime Tier List</a></h1>
        </header>

        <main class="anime-main">
            {% block content %}{% endblock %}
        </main>

        <footer class="anime-footer">
            <a href="/">← Back to Gainz</a>
        </footer>
    </div>
    {% load static %}
    <script src="{% static 'anime/anime.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
